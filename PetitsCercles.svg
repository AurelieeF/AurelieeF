<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="60%" stop-color="#15002a"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff56b"/>
      <stop offset="35%" stop-color="#ff8a3d"/>
      <stop offset="70%" stop-color="#ff2b83"/>
      <stop offset="100%" stop-color="#c400ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00fff0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="400" rx="14"/>
    </clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.15"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bgGrad)"/>

    <!-- sun -->
    <circle cx="600" cy="185" r="95" fill="url(#sunGrad)" filter="url(#softGlow)" opacity="0.8"/>
    <circle cx="600" cy="185" r="80" fill="url(#sunGrad)"/>
    <rect x="520" y="195" width="160" height="6" fill="#15002a"/>
    <rect x="520" y="210" width="160" height="8" fill="#15002a"/>
    <rect x="520" y="228" width="160" height="10" fill="#15002a"/>
    <rect x="520" y="248" width="160" height="14" fill="#15002a"/>

    <!-- perspective grid -->
    <g stroke="url(#gridGrad)" stroke-width="1.5" opacity="0.85">
      <line x1="600" y1="190" x2="-150" y2="400"/>
      <line x1="600" y1="190" x2="0" y2="400"/>
      <line x1="600" y1="190" x2="150" y2="400"/>
      <line x1="600" y1="190" x2="300" y2="400"/>
      <line x1="600" y1="190" x2="450" y2="400"/>
      <line x1="600" y1="190" x2="600" y2="400"/>
      <line x1="600" y1="190" x2="750" y2="400"/>
      <line x1="600" y1="190" x2="900" y2="400"/>
      <line x1="600" y1="190" x2="1050" y2="400"/>
      <line x1="600" y1="190" x2="1200" y2="400"/>
      <line x1="600" y1="190" x2="1350" y2="400"/>
    </g>
    <g stroke="url(#gridGrad)" stroke-width="1.2" opacity="0.7" fill="none">
      <line x1="120" y1="215" x2="1080" y2="215"/>
      <line x1="60" y1="248" x2="1140" y2="248"/>
      <line x1="0" y1="290" x2="1200" y2="290"/>
      <line x1="-80" y1="340" x2="1280" y2="340"/>
      <line x1="-200" y1="400" x2="1400" y2="400"/>
    </g>
  </g>

  <!-- CRT scanline overlay -->
  <rect width="1200" height="400" fill="url(#scanlines)" rx="14"/>

  <!-- border -->
  <rect x="2" y="2" width="1196" height="396" rx="14" fill="none" stroke="#00fff0" stroke-width="2" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- HUD corners -->
  <g stroke="#ff2bd6" stroke-width="3" fill="none" opacity="0.9">
    <path d="M20,50 L20,20 L50,20"/>
    <path d="M1150,20 L1180,20 L1180,50"/>
    <path d="M20,350 L20,380 L50,380"/>
    <path d="M1150,380 L1180,380 L1180,350"/>
  </g>

  <!-- terminal prompt -->
  <text x="80" y="100" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#00fff0" filter="url(#neonGlow)">&gt; whoami_</text>

  <!-- glitch title -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="46" text-anchor="middle">
    <text x="603" y="300" fill="#00fff0" opacity="0.65">ASPIRING SOFTWARE ENGINEER</text>
    <text x="597" y="300" fill="#ff2bd6" opacity="0.65">ASPIRING SOFTWARE ENGINEER</text>
    <text x="600" y="300" fill="#ffffff" filter="url(#neonGlow)">ASPIRING SOFTWARE ENGINEER</text>
  </g>

  <!-- subtitle -->
  <text x="600" y="335" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#c084fc" text-anchor="middle" letter-spacing="3">SELF-TAUGHT &#183; PYTHON &#183; BUILDING IN PUBLIC</text>
</svg>
