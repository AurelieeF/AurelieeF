name: generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: AurelieeF
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%23150022,%234a0f7a,%239b30ff,%23ff2d95,%23ffd93d
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
