name: Probe Exercism API (diagnostic, one-time use)

# One-off tool: tries a few candidate authenticated Exercism API endpoints
# with your real token and prints what each one returns (status code +
# a snippet of the response body). Writes nothing, commits nothing.
#
# Setup:
#   1. Get your token at https://exercism.org/settings/api_cli
#   2. In this repo: Settings tab -> Secrets and variables -> Actions
#      -> "New repository secret" -> name it EXERCISM_TOKEN, paste the token
#   3. Put this file at .github/workflows/exercism-api-probe.yml
#   4. Actions tab -> "Probe Exercism API" -> Run workflow
#   5. Open the "probe" job -> "Run probe" step, copy the whole output
#      (status codes + body snippets) and send it back for review.
#
# Safe to delete this workflow once we've figured out which endpoint works —
# it's a diagnostic tool, not part of the permanent pipeline.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run probe
        env:
          EXERCISM_TOKEN: ${{ secrets.EXERCISM_TOKEN }}
        run: |
          python3 generate_exercism_stats_svg.py --user AurelieeF --probe-api
