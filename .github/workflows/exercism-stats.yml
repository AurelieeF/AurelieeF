name: Update Exercism Stats SVG

# Refreshes exercism_stats.svg on demand. Exercism sits behind Cloudflare
# and blocks automated (non-browser) requests — including ones from GitHub
# Actions — so a scheduled "live scrape" isn't reliable and has been
# dropped. Instead: whenever you've finished new exercises, go to the
# Actions tab, click "Run workflow", type in the 3 numbers + your tracks
# from your profile page (https://exercism.org/profiles/AurelieeF), and
# it regenerates + commits the SVG for you. Takes about 15 seconds.
#
# Setup (only needed once):
#   1. This file lives at .github/workflows/exercism-stats.yml
#   2. generate_exercism_stats_svg.py lives at the repo root
#   3. No secrets needed — the default GITHUB_TOKEN is enough since this
#      workflow only commits to the same repo it runs in.

on:
  workflow_dispatch:
    inputs:
      reputation:
        description: "Reputation (from your profile page)"
        required: true
        default: "5"
      solutions:
        description: "Solutions published"
        required: true
        default: "5"
      badges:
        description: "Badges collected"
        required: true
        default: "2"
      tracks:
        description: "Tracks worked in, space-separated (e.g. Python Sqlite)"
        required: true
        default: "Python"

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate exercism_stats.svg
        run: |
          python3 generate_exercism_stats_svg.py \
            --user AurelieeF \
            --display-name Aurelie \
            --reputation "${{ github.event.inputs.reputation }}" \
            --solutions "${{ github.event.inputs.solutions }}" \
            --badges "${{ github.event.inputs.badges }}" \
            --tracks ${{ github.event.inputs.tracks }} \
            -o exercism_stats.svg

      - name: Commit changes if the SVG actually changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh exercism_stats.svg"
          file_pattern: exercism_stats.svg
