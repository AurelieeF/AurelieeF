  <text x="20" y="218" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12"><tspan fill="#5c4a7a">&#9500;&#9472;&#9472; </tspan><tspan fill="#9b30ff">02_embedded_systems</tspan></text>
