    <text class="rain" x="69"  y="0" fill="#c9a6ff" style="animation-duration:8.9s; animation-delay:-5.2s;">0<tspan x="69" dy="15">1</tspan><tspan x="69" dy="15">1</tspan><tspan x="69" dy="15">0</tspan><tspan x="69" dy="15">1</tspan><tspan x="69" dy="15">0</tspan></text>
