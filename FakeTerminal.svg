    <text class="rain" x="253" y="0" fill="#9b30ff" style="animation-duration:9.1s; animation-delay:-6.4s;">0<tspan x="253" dy="15">0</tspan><tspan x="253" dy="15">1</tspan><tspan x="253" dy="15">1</tspan><tspan x="253" dy="15">0</tspan><tspan x="253" dy="15">0</tspan></text>
    <text class="rain" x="391" y="0" fill="#ffd93d" style="animation-duration:7.2s; animation-delay:-3.8s;">1<tspan x="391" dy="15">0</tspan><tspan x="391" dy="15">0</tspan><tspan x="391" dy="15">1</tspan><tspan x="391" dy="15">1</tspan><tspan x="391" dy="15">0</tspan></text>
  </g>

  <rect width="520" height="330" rx="10" fill="url(#scanlines)"/>
  <rect x="1" y="1" width="518" height="328" rx="10" fill="none" stroke="#9b30ff" stroke-width="1.2" opacity="0.45"/>

  <path d="M14,30 L14,14 L30,14" stroke="#ffd93d" stroke-width="1.2" fill="none" opacity="0.6"/>
