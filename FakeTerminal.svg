  <line x1="20" y1="278" x2="380" y2="278" stroke="#9b30ff" stroke-width="1" opacity="0.25"/>

  <text x="20" y="300" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" fill="#8a7aa8"># direction</text>
  <text x="20" y="320" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12" fill="#ffffff">software &#8594; hardware &#8594; intelligent systems</text>
