<svg width="400" height="364" viewBox="0 0 400 364" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#150022"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.05"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="400" height="364" rx="10"/>
    </clipPath>
    <style>
      .rain { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes fall {
        0%   { transform: translateY(-60px); opacity: 0; }
        8%   { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateY(390px); opacity: 0; }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink {
        0%, 49%  { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="400" height="364" rx="10" fill="url(#bgGrad)"/>

  <g clip-path="url(#cardClip)" opacity="0.10" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12">
    <text class="rain" x="20"  y="0" fill="#ff2d95" style="animation-duration:9s;   animation-delay:-1s;">0<tspan x="20" dy="15">1</tspan><tspan x="20" dy="15">0</tspan><tspan x="20" dy="15">0</tspan><tspan x="20" dy="15">1</tspan><tspan x="20" dy="15">1</tspan></text>
    <text class="rain" x="60"  y="0" fill="#9b30ff" style="animation-duration:12s;  animation-delay:-4s;">1<tspan x="60" dy="15">1</tspan><tspan x="60" dy="15">0</tspan><tspan x="60" dy="15">1</tspan><tspan x="60" dy="15">0</tspan><tspan x="60" dy="15">0</tspan></text>
    <text class="rain" x="100" y="0" fill="#ffd93d" style="animation-duration:7s;   animation-delay:-2s;">0<tspan x="100" dy="15">0</tspan><tspan x="100" dy="15">1</tspan><tspan x="100" dy="15">0</tspan><tspan x="100" dy="15">1</tspan><tspan x="100" dy="15">0</tspan></text>
    <text class="rain" x="140" y="0" fill="#c9a6ff" style="animation-duration:10s;  animation-delay:-6s;">1<tspan x="140" dy="15">0</tspan><tspan x="140" dy="15">0</tspan><tspan x="140" dy="15">1</tspan><tspan x="140" dy="15">1</tspan><tspan x="140" dy="15">0</tspan></text>
    <text class="rain" x="180" y="0" fill="#ff2d95" style="animation-duration:8s;   animation-delay:-3s;">0<tspan x="180" dy="15">1</tspan><tspan x="180" dy="15">1</tspan><tspan x="180" dy="15">0</tspan><tspan x="180" dy="15">0</tspan><tspan x="180" dy="15">1</tspan></text>
    <text class="rain" x="220" y="0" fill="#9b30ff" style="animation-duration:11s;  animation-delay:-7s;">1<tspan x="220" dy="15">0</tspan><tspan x="220" dy="15">1</tspan><tspan x="220" dy="15">1</tspan><tspan x="220" dy="15">0</tspan><tspan x="220" dy="15">0</tspan></text>
    <text class="rain" x="260" y="0" fill="#ffd93d" style="animation-duration:9.5s; animation-delay:-5s;">0<tspan x="260" dy="15">0</tspan><tspan x="260" dy="15">1</tspan><tspan x="260" dy="15">1</tspan><tspan x="260" dy="15">0</tspan><tspan x="260" dy="15">1</tspan></text>
    <text class="rain" x="300" y="0" fill="#c9a6ff" style="animation-duration:7.5s; animation-delay:-1.5s;">1<tspan x="300" dy="15">1</tspan><tspan x="300" dy="15">0</tspan><tspan x="300" dy="15">0</tspan><tspan x="300" dy="15">1</tspan><tspan x="300" dy="15">0</tspan></text>
    <text class="rain" x="340" y="0" fill="#ff2d95" style="animation-duration:10.5s;animation-delay:-8s;">0<tspan x="340" dy="15">1</tspan><tspan x="340" dy="15">0</tspan><tspan x="340" dy="15">1</tspan><tspan x="340" dy="15">1</tspan><tspan x="340" dy="15">0</tspan></text>
    <text class="rain" x="380" y="0" fill="#9b30ff" style="animation-duration:8.5s; animation-delay:-4.5s;">1<tspan x="380" dy="15">0</tspan><tspan x="380" dy="15">0</tspan><tspan x="380" dy="15">1</tspan><tspan x="380" dy="15">0</tspan><tspan x="380" dy="15">1</tspan></text>
  </g>

  <rect width="400" height="364" rx="10" fill="url(#scanlines)"/>
  <rect x="1" y="1" width="398" height="362" rx="10" fill="none" stroke="#9b30ff" stroke-width="1.2" opacity="0.45"/>

  <path d="M14,30 L14,14 L30,14" stroke="#ffd93d" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M370,350 L386,350 L386,334" stroke="#ff2d95" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- title bar -->
  <rect x="1" y="1" width="398" height="28" rx="10" fill="#150022"/>
  <rect x="1" y="19" width="398" height="10" fill="#150022"/>
