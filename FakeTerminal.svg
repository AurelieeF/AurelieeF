<svg width="520" height="330" viewBox="0 0 520 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#150022"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.05"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="520" height="330" rx="10"/>
    </clipPath>
    <style>
      .rain { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes fall {
        0%   { transform: translateY(-60px); opacity: 0; }
        8%   { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink {
        0%, 49%  { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- base -->
  <rect width="520" height="330" rx="10" fill="url(#bgGrad)"/>

  <!-- fake hacking movement, super transparent, sits behind everything -->
  <g clip-path="url(#cardClip)" opacity="0.10" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12">
    <text class="rain" x="46"  y="0" fill="#ff2d95" style="animation-duration:9s; animation-delay:-1s;">0<tspan x="46" dy="15">1</tspan><tspan x="46" dy="15">0</tspan><tspan x="46" dy="15">0</tspan><tspan x="46" dy="15">1</tspan><tspan x="46" dy="15">1</tspan></text>
    <text class="rain" x="92"  y="0" fill="#9b30ff" style="animation-duration:12s; animation-delay:-4s;">1<tspan x="92" dy="15">1</tspan><tspan x="92" dy="15">0</tspan><tspan x="92" dy="15">1</tspan><tspan x="92" dy="15">0</tspan><tspan x="92" dy="15">0</tspan></text>
