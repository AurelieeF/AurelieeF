  <rect class="cursor" x="257" y="7" width="7" height="12" fill="#ffd93d"/>

  <!-- current focus block -->
  <text x="20" y="60" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="13" fill="#c9a6ff">$ <tspan fill="#ffffff">./current_focus.sh</tspan></text>

  <text x="30" y="86" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12" fill="#ffd93d">CURRENT   <tspan fill="#ffffff">Python</tspan></text>
  <text x="30" y="106" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12" fill="#ffd93d">PRACTICE  <tspan fill="#ffffff">Exercism &#183; LeetCode</tspan></text>
  <text x="30" y="126" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="12" fill="#ffd93d">METHOD    <tspan fill="#ffffff">build() &#8594; break() &#8594; learn()</tspan></text>

